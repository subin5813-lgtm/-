<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>김솔음의 휴대폰</title>
<style>
:root{--bg:#e9e9ee;--ink:#111}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink)}
body{display:flex;align-items:center;justify-content:center}
#phone{height:min(94vh,calc(94vw*16/9));aspect-ratio:9/16;background:#1b1b1d;border-radius:11% / 6.2%;padding:2.2%;box-shadow:0 20px 60px #0004;position:relative;font-size:min(1.9vh,3.4vw)}
#scr{width:100%;height:100%;border-radius:9.4% / 5.3%;overflow:hidden;position:relative;background:linear-gradient(160deg,#cfe3ff,#f6e6f5 60%,#ffe9d6)}
#island{position:absolute;top:1.6%;left:50%;width:27%;height:3.4%;transform:translateX(-50%);background:#000;border-radius:99px;z-index:50}
#status{position:absolute;top:0;left:0;right:0;height:6%;display:flex;justify-content:space-between;align-items:center;padding:0 9% 0 10%;font-weight:600;z-index:40;font-size:1.05em;pointer-events:none}
#home{position:absolute;inset:0;padding:16% 6% 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.8em 0}
.app{display:flex;flex-direction:column;align-items:center;gap:.35em;font-size:.78em;cursor:pointer}
.ic{width:3.9em;height:3.9em;border-radius:22%;display:grid;place-items:center;font-size:1.7em;color:#fff;box-shadow:0 2px 6px #0002}
.dock{position:absolute;left:4%;right:4%;bottom:2.5%;height:11%;background:#fff6;backdrop-filter:blur(14px);border-radius:2.2em;display:flex;justify-content:space-around;align-items:center}
.view{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;z-index:20;animation:in .22s}
@keyframes in{from{transform:scale(.92);opacity:0}}
.hd{padding:12% 4% 2.5%;display:flex;align-items:center;gap:.6em;border-bottom:1px solid #0001;font-weight:700;font-size:1.15em;background:#fafafa}
.hd button{border:0;background:none;color:#007aff;font-size:1em;cursor:pointer;padding:0}
.bd{flex:1;overflow:auto}
.row{padding:.9em 1em;border-bottom:1px solid #0000000d;display:flex;gap:.8em;align-items:center;cursor:pointer}
.row small{color:#888;display:block;margin-top:.15em}
.av{width:2.6em;height:2.6em;border-radius:50%;background:#cfd4dc;display:grid;place-items:center;flex:none}
.msgs{flex:1;overflow:auto;padding:.8em;display:flex;flex-direction:column;gap:.45em;background:#fff}
.b{max-width:75%;padding:.55em .85em;border-radius:1.1em;line-height:1.4;animation:in .15s}
.b.o{background:#e9e9eb;align-self:flex-start}
.b.m{background:#0a84ff;color:#fff;align-self:flex-end}
.kk .msgs{background:#abc1d1}.kk .b.o{background:#fff}.kk .b.m{background:#fee500;color:#111}
.bar{display:flex;gap:.5em;padding:.6em .6em 1.4em;background:#f6f6f6}
.bar input{flex:1;border:1px solid #ccc;border-radius:99px;padding:.6em .9em;font:inherit;min-width:0}
.bar button{border:0;border-radius:99px;background:#0a84ff;color:#fff;padding:0 1em;font:inherit}
.pad{padding:1em}.card{background:#f4f4f6;border-radius:.9em;padding:1em;margin-bottom:.8em;line-height:1.5}
#call{position:absolute;inset:0;z-index:60;background:linear-gradient(#3b4252,#1d2230);color:#fff;display:none;flex-direction:column;align-items:center;padding:22% 6% 8%}
#call h2{margin:.2em 0;font-size:1.9em;font-weight:500}
#log{flex:1;width:100%;overflow:auto;display:flex;flex-direction:column;gap:.5em;margin:1em 0}
.l{padding:.55em .85em;border-radius:1em;max-width:82%;line-height:1.4;animation:in .15s}
.l.o{background:#ffffff26;align-self:flex-start}.l.m{background:#0a84ff;align-self:flex-end}
.slide{width:100%;height:3.6em;background:#ffffff30;border-radius:99px;position:relative;display:grid;place-items:center;font-size:.95em;overflow:hidden;touch-action:none}
.knob{position:absolute;left:.3em;top:.3em;width:3em;height:3em;border-radius:50%;background:#34c759;display:grid;place-items:center;cursor:grab}
.end{background:#ff3b30;border:0;color:#fff;border-radius:99px;padding:.8em 2em;font:inherit;cursor:pointer}
#notif{position:absolute;left:4%;right:4%;top:-20%;background:#fffffff2;border-radius:1.2em;padding:.8em 1em;z-index:70;box-shadow:0 6px 20px #0003;transition:top .4s;cursor:pointer}
#notif.on{top:6.5%}#notif b{display:block;font-size:.8em;color:#666}
#hint{position:absolute;bottom:1.2%;left:50%;transform:translateX(-50%);width:34%;height:.5%;background:#111;border-radius:9px;z-index:80;cursor:pointer;min-height:4px}

.ic.im{background:none;box-shadow:none;position:relative;font-size:1.7em}.ic img{width:100%;height:100%;border-radius:22%;display:block}
.badge{position:absolute;top:-.45em;right:-.5em;min-width:1.5em;height:1.5em;padding:0 .4em;border-radius:99px;background:#ff3b30;color:#fff;font:600 .55em/1.5em sans-serif;text-align:center;font-style:normal;box-shadow:0 0 0 1px #fff8}
#lock{position:absolute;inset:0;z-index:45;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;padding-top:22%}
#scr.locked #status{color:#fff;z-index:46}#scr.locked #hint{background:#fff}
#lt{font-size:5.2em;font-weight:300;line-height:1}#ld{margin-top:.4em;opacity:.8}
#tap{margin-top:auto;padding-bottom:12%;opacity:.6}#pw{display:none;margin-top:auto;padding-bottom:12%;flex-direction:column;align-items:center;gap:1.4em}
#lock.pad #pw{display:flex}#lock.pad #tap{display:none}
.dots{display:flex;gap:1em}.dots i{width:.9em;height:.9em;border-radius:50%;border:1.5px solid #fff}.dots i.f{background:#fff}
.keys{display:grid;grid-template-columns:repeat(3,4.2em);gap:.9em}.keys button{height:4.2em;border-radius:50%;border:0;background:#ffffff26;color:#fff;font-size:1.5em;cursor:pointer}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.lh{background:#fff;border:0;padding-bottom:0}.lh button{background:#fff;border:1px solid #0002;border-radius:99px;padding:.6em 1.1em;color:#111}
.bd h1{margin:.2em .6em .3em;font-size:2.2em}.sr{gap:.6em;padding:.8em .8em .8em .3em;align-items:flex-start}.sr b{display:block}.sr small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:.7em;height:.7em;border-radius:50%;background:#3b82f6;flex:none;margin-top:1em}.dt{color:#888;font-size:.8em}.sb{position:sticky;bottom:1em;margin:1em;background:#f1f1f3;border-radius:99px;padding:.9em 1.2em;color:#888}
.sh{background:#fff;border:0;justify-content:space-between}.sh .cb{width:2.6em;height:2.6em;border-radius:50%;border:1px solid #0002;background:#fff;color:#111}.sh i{width:2.6em}
.who{display:flex;flex-direction:column;align-items:center;font-size:.75em;gap:.2em}
.kh{background:#b0c0d0;border:0;justify-content:space-between}.kh button{background:#fffc;color:#111;border-radius:99px;padding:.5em .9em}.pill{background:#fffc;border-radius:99px;padding:.5em .8em;font-size:.8em}
.view.kk .bd,.kk .msgs,.kk .bar{background:#b0c0d0}.kk .b.m{background:#f9e44a;color:#111}
.bar{align-items:center;background:#fff}.bar input{background:#f1f1f3;border:0}.plus{width:2.2em;height:2.2em;border-radius:50%;background:#f1f1f3;display:grid;place-items:center;flex:none}
.sep{align-self:center;color:#888;font-size:.75em;margin:.6em 0}.kk .sep{background:#0002;color:#fff;padding:.2em .8em;border-radius:99px}
.ic img{object-fit:cover;width:100%;height:100%}
